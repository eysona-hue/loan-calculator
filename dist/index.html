,.15);color:#bff7ff}.inputrow{display:flex;align-items:center;gap:10px;background:#070d1f;border:1px solid var(--line);border-radius:17px;padding:13px 14px}.inputrow span{color:#aab5cd}.inputrow input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:18px;font-weight:900}input[type=range]{width:100%;accent-color:var(--cyan);margin-top:10px}.side{display:grid;gap:18px}.ad{min-height:96px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.04);border-radius:30px;display:grid;place-items:center;color:#62708e;text-transform:uppercase;letter-spacing:.22em;font-size:11px;text-align:center;padding:16px}.payment{background:linear-gradient(135deg,rgba(103,232,249,.16),rgba(255,255,255,.06));border-color:rgba(103,232,249,.32)}.payment .label{font-size:13px;font-weight:900;letter-spacing:.18em;color:#a7f3ff;text-transform:uppercase}.payment .amount{font-size:48px;font-weight:950;margin:10px 0}.small{font-size:13px;color:var(--muted);line-height:1.5}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{background:rgba(27,32,50,.96);border:1px solid var(--line);border-radius:26px;padding:20px}.metric .ico{width:38px;height:38px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--cyan);margin-bottom:14px}.metric p{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900;margin:0}.metric b{display:block;font-size:20px;margin-top:7px}.tabs{margin-top:30px}.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:760px;background:rgba(255,255,255,.1);padding:6px;border-radius:24px}.tabbar button{border:0;border-radius:18px;background:transparent;color:#dce5fa;padding:16px;font-size:16px;font-weight:900;cursor:pointer}.tabbar button.active{background:var(--cyan);color:#06111f}.tabcontent{margin-top:22px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px}.chartbox{min-height:500px}.chartbox h3{font-size:26px;margin:0 0 20px}.svgwrap{width:100%;height:310px}.legend{display:grid;gap:10px;margin-top:12px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(8,13,29,.65);border-radius:14px;padding:12px 16px;color:#dbe4f8}.dot{width:12px;height:12px;border-radius:99px;display:inline-block;margin-right:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{background:rgba(8,13,29,.55);border:1px solid var(--line);border-radius:24px;padding:22px}.stat span{color:var(--muted);font-size:13px;font-weight:800}.stat b{font-size:28px;display:block;margin-top:8px}.tablewrap{overflow:auto;border-radius:20px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:920px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#0b1021;color:#c7d2ea}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.info{margin-top:30px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:30px;padding:28px;color:#dce5f8;line-height:1.65}.info h3{color:#fff;margin:18px 0 8px}.footer{margin-top:36px;padding:26px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:#aeb9d0}.page{max-width:920px;margin:auto}.page h2{font-size:44px}.page p,.page li{color:#d7def2;line-height:1.75}.hide{display:none!important}
    @media(max-width:980px){.grid,.charts{grid-template-columns:1fr}.hero h2{font-size:42px}.wrap{padding:18px}.nav{align-items:flex-start;flex-direction:column}.menu{width:100%}.pill,.btn,.lang{padding:10px 12px}.inputs{grid-template-columns:1fr}.metrics,.stats{grid-template-columns:1fr 1fr}.chartbox{min-height:auto}.tabbar{grid-template-columns:1fr 1fr}}

<script>
const siteUrl='https://loan-calculator-neon-two.vercel.app/';
const contactEmail='loancal@altmail.kr';
const colors=['#67e8f9','#a78bfa','#34d399','#fbbf24','#fb923c','#f472b6'];
const dict={en:{calc:'Calculator',about:'About',privacy:'Privacy',terms:'Terms',contact:'Contact',reset:'Reset',tag:'Smart loan calculator with home and auto modes',hero:'Plan any major loan with clarity, speed, and confidence.',sub:'Compare mortgage and car payments using a standard fixed-rate amortization formula, with monthly schedules, charts, extra payments, PMI estimates, and downloadable reports.',home:'Home Loan',homeSub:'Mortgage, taxes, insurance, HOA',car:'Car Loan',carSub:'Auto financing, insurance, fees, add ons',priceHome:'Home Price',priceCar:'Vehicle Price',down:'Down Payment',rate:'Interest Rate',term:'Loan Term',taxHome:'Annual Property Taxes',taxCar:'Annual Registration / Fees',ins:'Annual Insurance',hoa:'Monthly HOA',addons:'Monthly Warranty / Add-ons',extra:'Extra Monthly Payment',pmi:'PMI Annual Rate',income:'Gross Annual Income',debt:'Other Monthly Debt',first:'Estimated First Monthly Payment',req:'Required payment',extraPay:'Extra payment',incl:'Includes principal, interest, taxes/fees, insurance, possible PMI, and optional extra payment.',loanAmount:'Loan Amount',saved:'Interest Saved',totalInt:'Total Interest',payoff:'Payoff',ratio:'Housing Ratio',noExtra:'No Extra Payoff',charts:'Charts',breakdown:'Breakdown',compare:'Compare',schedule:'Schedule',balance:'Balance over time',pie:'Monthly payment breakdown',principalInterest:'Principal and Interest',taxes:'Taxes',fees:'Registration / Fees',insurance:'Insurance',pmiLabel:'PMI',downloadCsv:'Download CSV',downloadPdf:'Download PDF Report',month:'Month',year:'Year',startBal:'Starting Balance',payment:'Total Payment',principal:'Principal Paid',interest:'Interest Paid',pmiPaid:'PMI Paid',endBal:'Ending Balance',totalPaid:'Estimated Total Paid',financeCost:'Financed Cost',current:'Current Scenario',rateUp:'Rate + 0.50%',afford:'Affordability check',extraImpact:'Extra payment impact',report:'LoanFlow Loan Report',footer:'Free planning tool. Estimates only, not financial advice.',adTop:'Future Google AdSense Banner',adSide:'Future Google AdSense Sidebar Ad',adMid:'Future Google AdSense In-content Ad',how:'How to use this calculator',howText:'Enter the price, down payment, rate, term, taxes or fees, insurance, and optional extra payment. The charts and schedule update automatically.',formula:'How calculations work',formulaText:'Principal and interest use the standard fixed-rate amortization formula. Other costs are added as monthly estimates and do not accrue loan interest.',disclaimer:'Estimates are for planning purposes only. Actual lender quotes may vary because of APR, credit score, closing costs, escrow rules, taxes, insurance, dealer fees, local regulations, loan type, and payment timing.'},es:{calc:'Calculadora',about:'Acerca de',privacy:'Privacidad',terms:'Términos',contact:'Contacto',reset:'Reiniciar',tag:'Calculadora inteligente para préstamos de vivienda y autos',hero:'Planifica cualquier préstamo importante con claridad, rapidez y confianza.',sub:'Compara pagos de hipoteca y préstamos de auto usando una fórmula estándar de amortización a tasa fija, con calendarios mensuales, gráficos, pagos extra, PMI estimado y reportes descargables.',home:'Préstamo de Vivienda',homeSub:'Hipoteca, impuestos, seguro, HOA',car:'Préstamo de Auto',carSub:'Financiamiento, seguro, cargos, adicionales',priceHome:'Precio de la Vivienda',priceCar:'Precio del Vehículo',down:'Inicial',rate:'Tasa de Interés',term:'Plazo del Préstamo',taxHome:'Impuestos Anuales de Propiedad',taxCar:'Registro / Cargos Anuales',ins:'Seguro Anual',hoa:'HOA Mensual',addons:'Garantía / Adicionales Mensuales',extra:'Pago Extra Mensual',pmi:'Tasa Anual de PMI',income:'Ingreso Bruto Anual',debt:'Otras Deudas Mensuales',first:'Primer Pago Mensual Estimado',req:'Pago requerido',extraPay:'Pago extra',incl:'Incluye principal, interés, impuestos/cargos, seguro, posible PMI y pago extra opcional.',loanAmount:'Monto del Préstamo',saved:'Interés Ahorrado',totalInt:'Interés Total',payoff:'Pago Final',ratio:'Ratio de Vivienda',noExtra:'Sin Pago Extra',charts:'Gráficos',breakdown:'Desglose',compare:'Comparar',schedule:'Calendario',balance:'Balance en el tiempo',pie:'Desglose del pago mensual',principalInterest:'Principal e Interés',taxes:'Impuestos',fees:'Registro / Cargos',insurance:'Seguro',pmiLabel:'PMI',downloadCsv:'Descargar CSV',downloadPdf:'Descargar Reporte PDF',month:'Mes',year:'Año',startBal:'Balance Inicial',payment:'Pago Total',principal:'Principal Pagado',interest:'Interés Pagado',pmiPaid:'PMI Pagado',endBal:'Balance Final',totalPaid:'Total Estimado Pagado',financeCost:'Costo Financiado',current:'Escenario Actual',rateUp:'Tasa + 0.50%',afford:'Revisión de capacidad de pago',extraImpact:'Impacto del pago extra',report:'Reporte de Préstamo LoanFlow',footer:'Herramienta gratuita de planificación. Solo estimaciones, no asesoría financiera.',adTop:'Espacio futuro para anuncio superior de Google AdSense',adSide:'Espacio futuro para anuncio lateral de Google AdSense',adMid:'Espacio futuro para anuncio de contenido de Google AdSense',how:'Cómo usar esta calculadora',howText:'Ingresa el precio, inicial, tasa, plazo, impuestos o cargos, seguro y pago extra opcional. Los gráficos y el calendario se actualizan automáticamente.',formula:'Cómo funcionan los cálculos',formulaText:'El principal e interés usan la fórmula estándar de amortización a tasa fija. Otros costos se agregan como estimaciones mensuales y no generan interés de préstamo.',disclaimer:'Las estimaciones son solo para planificación. Las cotizaciones reales pueden variar por APR, crédito, costos de cierre, reglas de escrow, impuestos, seguro, cargos del dealer, reglas locales, tipo de préstamo y momento del pago.'}};
let lang=localStorage.getItem('lf_lang')||'en', loanType='home', tab='charts', selectedSlice=0;
const state={price:450000,downPayment:90000,rate:6.75,years:30,taxes:5200,insurance:1800,hoa:0,extraPayment:200,pmiAnnualRate:.75,grossIncome:90000,monthlyDebt:600};
function t(k){return dict[lang][k]||dict.en[k]||k}function money(v){return new Intl.NumberFormat(lang==='es'?'es-US':'en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(isFinite(v)?v:0)}function num(v){return new Intl.NumberFormat(lang==='es'?'es-US':'en-US',{maximumFractionDigits:2}).format(isFinite(v)?v:0)}
function calc(input=state, extraOverride=null, rateOverride=null){const price=Math.max(+input.price||0,0),down=Math.min(Math.max(+input.downPayment||0,0),price),P=Math.max(price-down,0),months=Math.max(Math.round((+input.years||0)*12),1),r=Math.max(rateOverride??+input.rate||0,0)/100/12,ltv=price?P/price:0,base=P===0?0:r===0?P/months:P*(r*Math.pow(1+r,months))/(Math.pow(1+r,months)-1),tax=(+input.taxes||0)/12,ins=(+input.insurance||0)/12,hoa=+input.hoa||0,extra=Math.max(extraOverride??+input.extraPayment||0,0),pmi=(loanType==='home'&&ltv>.8)?P*((+input.pmiAnnualRate||0)/100)/12:0;let bal=P,totalI=0,totalP=0,totalPmi=0,rows=[],yearly=[],payoff=0;for(let m=1;m<=months&&bal>.005;m++){let start=bal,interest=bal*r,currentLtv=price?bal/price:0,pmiM=pmi&&currentLtv>.8?pmi:0,principal=Math.min(Math.max(base-interest,0)+extra,bal),payment=base+tax+ins+hoa+pmiM+extra;bal=Math.max(bal-principal,0);totalI+=interest;totalP+=principal;totalPmi+=pmiM;payoff=m;rows.push({month:m,year:Math.ceil(m/12),startBalance:start,totalPayment:payment,principalPaid:principal,interestPaid:interest,pmiPaid:pmiM,endBalance:bal});if(m%12===0||bal===0)yearly.push({x:m,balance:bal,interestPaid:totalI,principalPaid:totalP,pmiPaid:totalPmi})}const required=base+tax+ins+hoa+pmi,total=required+extra;return{price,down,principal:P,months,basePayment:base,monthlyTaxes:tax,monthlyInsurance:ins,monthlyHoa:hoa,monthlyPmi:pmi,requiredMonthlyPayment:required,monthlyTotal:total,totalInterest:totalI,totalPmi,totalPaid:down+P+totalI+totalPmi+(tax+ins+hoa)*payoff,totalFinanced:P+totalI+totalPmi,payoffMonth:payoff,rows,yearly,interestSaved:Math.max(calcNoExtraInterest(P,months,r,base)-totalI,0)}}
function calcNoExtraInterest(P,months,r,base){let b=P,i=0;for(let m=1;m<=months&&b>.005;m++){let intr=b*r,pp=Math.min(Math.max(base-intr,0),b);b-=pp;i+=intr}return i}
function inputs(){const isCar=loanType==='car',downPct=state.price?Math.min(state.downPayment,state.price)/state.price*100:0;let arr=[['price',isCar?t('priceCar'):t('priceHome'),isCar?5000:50000,isCar?250000:2000000,isCar?500:5000,'$'],['downPayment',t('down'),0,state.price,isCar?250:1000,'$',num(downPct)+'% down'],['rate',t('rate'),0,25,.05,'','%'],['years',t('term'),1,isCar?8:40,1,'',lang==='es'?' años':' years'],['taxes',isCar?t('taxCar'):t('taxHome'),0,isCar?5000:50000,50,'$'],['insurance',t('ins'),0,isCar?10000:20000,100,'$'],['hoa',isCar?t('addons'):t('hoa'),0,isCar?1000:3000,25,'$'],['extraPayment',t('extra'),0,5000,25,'$']];if(!isCar)arr.push(['pmiAnnualRate',t('pmi'),0,2.5,.05,'','%',state.downPayment/state.price>=.2?(lang==='es'?'No se necesita con 20% inicial':'Not needed at 20% down'):'PMI']);arr.push(['grossIncome',t('income'),0,500000,1000,'$'],['monthlyDebt',t('debt'),0,20000,50,'$']);return arr}
function render(){let path=location.pathname.replace('/','')||'calc',r=calc(),noExtra=calc(state,0),higher=calc(state,state.extraPayment,+state.rate+.5),monthlyIncome=(+state.grossIncome||0)/12,housing=monthlyIncome?r.requiredMonthlyPayment/monthlyIncome*100:0,totalDebt=monthlyIncome?(r.requiredMonthlyPayment+(+state.monthlyDebt||0))/monthlyIncome*100:0;document.documentElement.lang=lang;document.getElementById('app').innerHTML=`<div class="wrap"><nav class="nav"><a class="brand" href="/"><div class="logo">▦</div><div><h1>LoanFlow</h1><p>${lang==='es'?'Planificación de préstamos simple y clara':'Simple, clear loan planning'}</p></div></a><div class="menu"><a class="pill keep ${path==='calc'?'active':''}" href="/">${t('calc')}</a><a class="pill ${path==='about'?'active':''}" href="/about">${t('about')}</a><a class="pill ${path==='privacy'?'active':''}" href="/privacy">${t('privacy')}</a><a class="pill ${path==='terms'?'active':''}" href="/terms">${t('terms')}</a><a class="pill ${path==='contact'?'active':''}" href="/contact">${t('contact')}</a><select class="lang" id="lang"><option value="en">English</option><option value="es">Español</option></select><button class="btn" id="reset">↻ ${t('reset')}</button></div></nav>${path==='calc'?calcPage(r,noExtra,higher,housing,totalDebt):page(path)}<footer class="footer"><span>© ${new Date().getFullYear()} LoanFlow. ${t('footer')}</span><span><a href="/privacy">${t('privacy')}</a> · <a href="/terms">${t('terms')}</a> · <a href="/about">${t('about')}</a> · <a href="/contact">${t('contact')}</a></span></footer></div>`;bind(r,noExtra,higher,housing,totalDebt)}
function calcPage(r,noExtra,higher,housing,totalDebt){let py=Math.floor(r.payoffMonth/12),pm=r.payoffMonth%12,npy=Math.floor(noExtra.payoffMonth/12),npm=noExtra.payoffMonth%12;return `<div class="ad">${t('adTop')}</div><section class="grid"><main class="hero"><div class="tag">✧ ${t('tag')}</div><h2>${t('hero')}</h2><p>${t('sub')}</p><div class="loan-toggle"><button id="homeBtn" class="${loanType==='home'?'active':''}">⌂ ${t('home')}<br><small>${t('homeSub')}</small></button><button id="carBtn" class="${loanType==='car'?'active':''}">⌁ ${t('car')}<br><small>${t('carSub')}</small></button></div><div class="card"><div class="inputs">${inputs().map(f=>field(...f)).join('')}</div></div></main><aside class="side"><div class="ad">${t('adSide')}</div><div class="card payment"><div class="label">${t('first')}</div><div class="amount">${money(r.monthlyTotal)}</div><div class="small">${t('req')}: <b>${money(r.requiredMonthlyPayment)}</b>. ${t('extraPay')}: <b>${money(state.extraPayment)}</b>.<br>${t('incl')}</div></div><div class="metrics">${metric('⌂',t('loanAmount'),money(r.principal))}${metric('◌',t('saved'),money(r.interestSaved))}${metric('↗',t('totalInt'),money(r.totalInterest))}${metric('▣',t('payoff'),`${py}y ${pm}m`)}${metric('◇',loanType==='car'?'Debt Ratio':t('ratio'),num(loanType==='car'?totalDebt:housing)+'%')}${metric('◷',t('noExtra'),`${npy}y ${npm}m`)}</div></aside></section><section class="tabs"><div class="ad">${t('adMid')}</div><div class="tabbar">${['charts','breakdown','compare','schedule'].map(x=>`<button data-tab="${x}" class="${tab===x?'active':''}">${t(x)}</button>`).join('')}</div><div class="tabcontent">${tabView(r,noExtra,higher,housing,totalDebt)}</div></section><section class="info"><h3>${t('how')}</h3><p>${t('howText')}</p><h3>${t('formula')}</h3><p>${t('formulaText')}</p><p><b>M = P × [ r(1+r)^n / ((1+r)^n − 1) ]</b></p><p>${t('disclaimer')}</p></section>`}
function field(k,label,min,max,step,prefix='',suffix='',hint=''){return `<div class="field"><label>${label}${hint?`<span class="badge">${hint}</span>`:''}</label><div class="inputrow">${prefix?`<span>${prefix}</span>`:''}<input type="number" data-k="${k}" value="${state[k]}" step="${step}">${suffix?`<span>${suffix}</span>`:''}</div><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${state[k]}"></div>`}
function metric(i,l,v){return `<div class="metric"><div class="ico">${i}</div><p>${l}</p><b>${v}</b></div>`}
function breakdown(r){return[{n:t('principalInterest'),v:r.basePayment,c:colors[0]},{n:loanType==='car'?t('fees'):t('taxes'),v:r.monthlyTaxes,c:colors[1]},{n:t('insurance'),v:r.monthlyInsurance,c:colors[2]},{n:loanType==='car'?t('addons'):t('hoa'),v:r.monthlyHoa,c:colors[3]},{n:t('pmiLabel'),v:r.monthlyPmi,c:colors[4]},{n:t('extra'),v:+state.extraPayment||0,c:colors[5]}].filter(x=>x.v>0)}
function tabView(r,noExtra,higher,housing,totalDebt){if(tab==='charts')return `<div class="charts"><div class="card chartbox"><h3>${t('balance')}</h3>${balanceChart(r)}</div><div class="card chartbox"><h3>${t('pie')}</h3>${donut(r)}</div></div>`; if(tab==='breakdown')return `<div class="stats">${stat(t('principalInterest'),money(r.basePayment))}${stat(loanType==='car'?t('fees'):t('taxes')+' + '+t('insurance'),money(r.monthlyTaxes+r.monthlyInsurance))}${stat(t('totalPaid'),money(r.totalPaid))}${stat(t('financeCost'),money(r.totalFinanced))}${stat(t('pmiPaid'),money(r.totalPmi))}${stat(t('payoff'),Math.floor(r.payoffMonth/12)+'y '+r.payoffMonth%12+'m')}</div>`; if(tab==='compare')return `<div class="stats">${stat(t('current'),money(r.monthlyTotal))}${stat(t('noExtra'),money(noExtra.requiredMonthlyPayment))}${stat(t('rateUp'),money(higher.monthlyTotal))}${stat(t('afford'),num(housing)+'% / '+num(totalDebt)+'%')}${stat(t('extraImpact'),money(r.interestSaved))}</div>`;return `<div class="actions"><button class="btn primary" id="csv">${t('downloadCsv')}</button><button class="btn primary" id="pdf">${t('downloadPdf')}</button></div><div class="tablewrap"><table><thead><tr><th>${t('month')}</th><th>${t('year')}</th><th>${t('startBal')}</th><th>${t('payment')}</th><th>${t('principal')}</th><th>${t('interest')}</th><th>${t('pmiPaid')}</th><th>${t('endBal')}</th></tr></thead><tbody>${r.rows.map(row=>`<tr><td>${row.month}</td><td>${row.year}</td><td>${money(row.startBalance)}</td><td>${money(row.totalPayment)}</td><td>${money(row.principalPaid)}</td><td>${money(row.interestPaid)}</td><td>${money(row.pmiPaid)}</td><td>${money(row.endBalance)}</td></tr>`).join('')}</tbody></table></div>`}
function stat(l,v){return `<div class="stat"><span>${l}</span><b>${v}</b></div>`}
function balanceChart(r){let w=720,h=310,p=46,max=Math.max(...r.rows.map(x=>x.startBalance),1),pts=r.rows.map((x,i)=>[p+(i/(r.rows.length-1||1))*(w-p-15),p+(1-x.endBalance/max)*(h-p-20)]),d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')+` L ${w-15} ${h-p} L ${p} ${h-p} Z`,line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');return `<div class="svgwrap"><svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#67e8f9" stop-opacity=".45"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient></defs>${[0,.25,.5,.75,1].map(v=>`<line x1="${p}" x2="${w-15}" y1="${p+v*(h-p-20)}" y2="${p+v*(h-p-20)}" stroke="rgba(255,255,255,.12)" stroke-dasharray="4"/><text x="8" y="${p+v*(h-p-20)+5}" fill="#a8b3cc" font-size="14">${money(max*(1-v)).replace('.00','')}</text>`).join('')}<path d="${d}" fill="url(#g)"/><path d="${line}" fill="none" stroke="#67e8f9" stroke-width="2"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" stroke="#a8b3cc"/><line x1="${p}" y1="${h-p}" x2="${w-15}" y2="${h-p}" stroke="#a8b3cc"/><text x="${p}" y="${h-10}" fill="#a8b3cc" font-size="13">1</text><text x="${w-32}" y="${h-10}" fill="#a8b3cc" font-size="13">${r.payoffMonth}</text></svg></div>`}
function donut(r){let data=breakdown(r),total=data.reduce((s,x)=>s+x.v,0),sel=data[selectedSlice]||data[0];let acc=0,cx=150,cy=150,ro=118,ri=70;function arc(fr,to){let a1=fr*2*Math.PI-Math.PI/2,a2=to*2*Math.PI-Math.PI/2,large=to-fr>.5?1:0;let p1=[cx+ro*Math.cos(a1),cy+ro*Math.sin(a1)],p2=[cx+ro*Math.cos(a2),cy+ro*Math.sin(a2)],p3=[cx+ri*Math.cos(a2),cy+ri*Math.sin(a2)],p4=[cx+ri*Math.cos(a1),cy+ri*Math.sin(a1)];return `M${p1} A${ro},${ro} 0 ${large} 1 ${p2} L${p3} A${ri},${ri} 0 ${large} 0 ${p4} Z`}return `<div class="svgwrap"><svg viewBox="0 0 300 300" width="100%" height="100%">${data.map((x,i)=>{let from=acc/total,to=(acc+x.v)/total;acc+=x.v;return `<path data-slice="${i}" d="${arc(from,to)}" fill="${x.c}" stroke="#1b2032" stroke-width="4" style="cursor:pointer;opacity:${i===selectedSlice?1:.82}"/>`}).join('')}<circle cx="150" cy="150" r="62" fill="#1b2032"/><text x="150" y="142" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">${sel?sel.n:''}</text><text x="150" y="166" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="900">${sel?money(sel.v):''}</text></svg></div><div class="legend">${data.map((x,i)=>`<div class="legend-row" data-slice="${i}" style="cursor:pointer"><span><i class="dot" style="background:${x.c}"></i>${x.n}</span><b>${money(x.v)}</b></div>`).join('')}</div>`}
function page(p){let titles={about:t('about'),privacy:t('privacy'),terms:t('terms'),contact:t('contact')};return `<main class="page card"><h2>${titles[p]||t('about')}</h2>${p==='about'?`<p>LoanFlow is a free bilingual loan planning tool built to help visitors estimate home and car loan payments, compare scenarios, understand interest costs, and export reports.</p><p>${t('disclaimer')}</p>`:''}${p==='privacy'?`<p>We do not ask users to create accounts. Calculator inputs are processed in your browser. Future advertising tools such as Google AdSense may use cookies or similar technologies according to their own policies.</p><p>Contact: ${contactEmail}</p>`:''}${p==='terms'?`<p>This website provides estimates for educational and planning purposes only. It is not financial, legal, tax, lending, or investment advice. Users should verify all numbers with a qualified lender or advisor before making decisions.</p>`:''}${p==='contact'?`<p>Questions, feedback, or corrections are welcome.</p><p><b>Email:</b> <a href="mailto:${contactEmail}">${contactEmail}</a></p>`:''}</main>`}
function bind(r,noExtra,higher,housing,totalDebt){document.getElementById('lang').value=lang;document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('lf_lang',lang);render()};document.getElementById('reset').onclick=()=>{loanType='home';Object.assign(state,{price:450000,downPayment:90000,rate:6.75,years:30,taxes:5200,insurance:1800,hoa:0,extraPayment:200,pmiAnnualRate:.75,grossIncome:90000,monthlyDebt:600});render()};document.querySelectorAll('[data-k]').forEach(el=>el.oninput=e=>{state[e.target.dataset.k]=Number(e.target.value);document.querySelectorAll(`[data-k="${e.target.dataset.k}"]`).forEach(x=>x.value=e.target.value);render()});let hb=document.getElementById('homeBtn'),cb=document.getElementById('carBtn');if(hb)hb.onclick=()=>{loanType='home';Object.assign(state,{price:450000,downPayment:90000,rate:6.75,years:30,taxes:5200,insurance:1800,hoa:0,extraPayment:200,pmiAnnualRate:.75,grossIncome:90000,monthlyDebt:600});render()};if(cb)cb.onclick=()=>{loanType='car';Object.assign(state,{price:38000,downPayment:5000,rate:7.25,years:5,taxes:950,insurance:1800,hoa:0,extraPayment:50,pmiAnnualRate:0,grossIncome:65000,monthlyDebt:400});render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-slice]').forEach(s=>s.onclick=()=>{selectedSlice=Number(s.dataset.slice);render()});let csv=document.getElementById('csv');if(csv)csv.onclick=()=>downloadCsv(r);let pdf=document.getElementById('pdf');if(pdf)pdf.onclick=()=>printReport(r,housing,totalDebt)}
function downloadCsv(r){let rows=[['LoanFlow Calculator'],['Website',siteUrl],['Loan Type',loanType],['Price',state.price],['Down Payment',state.downPayment],['Interest Rate',state.rate+'%'],['Term Years',state.years],[],[t('month'),t('year'),t('startBal'),t('payment'),t('principal'),t('interest'),t('pmiPaid'),t('endBal')],...r.rows.map(x=>[x.month,x.year,x.startBalance.toFixed(2),x.totalPayment.toFixed(2),x.principalPaid.toFixed(2),x.interestPaid.toFixed(2),x.pmiPaid.toFixed(2),x.endBalance.toFixed(2)])];let csv='sep=,\r\n'+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LoanFlow-${loanType}-monthly-schedule.csv`;a.click();URL.revokeObjectURL(url)}
function printReport(r,housing,totalDebt){let w=window.open('','_blank');let rows=r.rows.slice(0,120).map(x=>`<tr><td>${x.month}</td><td>${money(x.totalPayment)}</td><td>${money(x.principalPaid)}</td><td>${money(x.interestPaid)}</td><td>${money(x.endBalance)}</td></tr>`).join('');w.document.write(`<html><head><title>${t('report')}</title><style>body{font-family:Arial;margin:40px;color:#111}h1{color:#0f172a}.brand{color:#0891b2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{border:1px solid #ddd;border-radius:14px;padding:16px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:right}th:first-child,td:first-child{text-align:left}.foot{margin-top:28px;color:#475569;font-size:12px}@media print{button{display:none}}</style></head><body><h1><span class="brand">LoanFlow</span> Loan Report</h1><p>Generated at ${siteUrl}</p><div class="grid"><div class="box"><b>${t('first')}</b><br>${money(r.monthlyTotal)}</div><div class="box"><b>${t('totalInt')}</b><br>${money(r.totalInterest)}</div><div class="box"><b>${t('totalPaid')}</b><br>${money(r.totalPaid)}</div></div><h2>${t('schedule')}</h2><table><thead><tr><th>${t('month')}</th><th>${t('payment')}</th><th>${t('principal')}</th><th>${t('interest')}</th><th>${t('endBal')}</th></tr></thead><tbody>${rows}</tbody></table><p class="foot">Create your own free loan report at ${siteUrl}. ${t('disclaimer')}</p><button onclick="window.print()">Print / Save as PDF</button><script>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close()}
window.addEventListener('popstate',render);document.addEventListener('click',e=>{let a=e.target.closest('a[href^="/"]');if(a){e.preventDefault();history.pushState(null,'',a.getAttribute('href'));render()}});render();
</script>
